<div class="layout" *ngIf="auth.isAuthenticated(); else loginTemplate">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">F</div>
      <div>
        <div class="sidebar-title">Financeiro</div>
        <div class="sidebar-subtitle">Painel de controle</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <span class="material-icons-outlined">dashboard</span>
        Dashboard
      </a>
      <a routerLink="/lancamentos" routerLinkActive="active">
        <span class="material-icons-outlined">receipt_long</span>
        Lancamentos
      </a>
      <a routerLink="/novo" routerLinkActive="active">
        <span class="material-icons-outlined">add_circle_outline</span>
        Novo Lancamento
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar">
          <span class="material-icons-outlined">person</span>
        </div>
        <div class="sidebar-user-info">
          <div style="font-weight:600;">Admin</div>
          <div style="opacity:0.6; font-size:0.75rem;">Administrador</div>
        </div>
      </div>
      <button class="btn btn-outline" style="width:100%; margin-top:12px; color:rgba(255,255,255,0.7); border-color:rgba(255,255,255,0.2);" (click)="logout()">
        <span class="material-icons-outlined" style="font-size:18px;">logout</span>
        Sair
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

<ng-template #loginTemplate>
  <router-outlet></router-outlet>
</ng-template>
