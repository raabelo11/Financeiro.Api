<div class="container">
  <div class="card" style="max-width:420px;margin:36px auto;">
    <h2>Entrar</h2>
    <div style="margin-top:12px;">
      <input class="input" placeholder="Usuário" [(ngModel)]="username" />
    </div>
    <div style="margin-top:8px;">
      <input class="input" type="password" placeholder="Senha" [(ngModel)]="password" />
    </div>
    <div style="margin-top:12px; display:flex; gap:8px;">
      <button class="btn btn-primary" (click)="submit()">Entrar</button>
      <button class="btn" routerLink="/">Voltar</button>
    </div>
    <div style="color:#d9534f; margin-top:10px;" *ngIf="error">{{error}}</div>
    <div style="margin-top:8px; color:#7a869a; font-size:0.9rem">Usuários de teste: admin/admin e usuario/usuario</div>
  </div>
</div>
